name: Estatistica multimodelo

# Calcula estatisticas agregadas das 7 IAs materializadas e publica
# docs/dados/estatistica.json. Nao exporta texto de chamado.

on:
  # Agendamento periodico (a cada 6h) para manter a estatistica fresca, alem do
  # gatilho por workflow_run apos "Comparar modelos (lote)".
  #
  # O gatilho por workflow_run do "Transformer fine-tuning (BERTimbau)" foi
  # removido: esse workflow ja roda 1x/dia (noturno) e, quando termina perto
  # do cron de 6h em 6h, os dois disparos legitimos calculam
  # docs/dados/estatistica.json a partir de estados diferentes quase ao mesmo
  # tempo. O concurrency group 'escrita-planilha' so serializa a ORDEM dos
  # jobs, nao evita que o segundo calcule sobre dado mais novo que o commit
  # local do primeiro -- resultando em conflito de conteudo real no mesmo
  # arquivo. O commit estatistica.yml NAO pode resolver isso automaticamente
  # (ver tests/test_governanca_writers_git.py: nada de -X theirs/ours nem
  # reset --hard), entao a mitigacao e' eliminar o gatilho redundante em vez
  # de tentar autorresolver o conflito.
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Comparar modelos (lote)"
    types:
      - completed

concurrency:
  group: escrita-planilha
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  estatistica:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-estatistica.txt"
      - name: Instalar dependencias estatisticas
        run: python -m pip install --retries 5 --timeout 120 -r requirements-estatistica.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Calcular estatisticas
        run: python src/analise_estatistica.py
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Commit estatistica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dados/estatistica.json
          git diff --cached --quiet && { echo "sem mudancas estatisticas"; exit 0; }
          git commit -m "dados estatisticos [skip ci]"
          for i in 1 2 3 4 5; do
            # Falha explicita em conflito real: sem -X theirs, um conflito verdadeiro
            # em docs/dados/estatistica.json aborta o rebase (linha abaixo) em vez de
            # escolher uma versao silenciosamente.
            git pull --rebase --autostash origin main && git push && exit 0
            # aborta rebase preso para a proxima tentativa nao herdar 'unmerged files'.
            git rebase --abort 2>/dev/null || true
            echo "push rejeitado (tentativa $i/5); novo rebase em 5s"; sleep 5
          done
          echo "push falhou apos 5 tentativas" >&2; exit 1
