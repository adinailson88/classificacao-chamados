name: Sincronizar correcoes de categoria no GLPI

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "dry-run apenas le; aplicar altera somente linhas aprovadas"
        type: choice
        options:
          - dry-run
          - aplicar
        default: dry-run
      ids:
        description: "IDs separados por virgula; vazio usa a fila elegivel"
        type: string
        default: ""
      limite:
        description: "Quantidade maxima; 0 = sem limite (use 1 no primeiro teste)"
        type: string
        default: "1"
      confirmacao:
        description: "Para aplicar, digite exatamente APLICAR_GLPI"
        type: string
        default: ""

concurrency:
  group: sincronizacao-glpi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dry-run:
    if: ${{ inputs.modo == 'dry-run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GLPI_CORRECOES_SPREADSHEET_ID: ${{ secrets.GLPI_CORRECOES_SPREADSHEET_ID }}
      GLPI_BASE_URL: ${{ secrets.GLPI_BASE_URL }}
      GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
      GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-leves.txt
      - name: Instalar dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Executar dry-run
        env:
          INPUT_IDS: ${{ inputs.ids }}
          INPUT_LIMITE: ${{ inputs.limite }}
        run: |
          python src/sincronizar_correcoes_glpi.py \
            --ids "$INPUT_IDS" \
            --limite "$INPUT_LIMITE" \
            --saida-json outputs/glpi/relatorio.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: relatorio-sincronizacao-glpi-${{ github.run_id }}
          path: outputs/glpi/relatorio.json
          if-no-files-found: warn
          retention-days: 14
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json

  aplicar:
    if: ${{ inputs.modo == 'aplicar' }}
    runs-on: ubuntu-latest
    environment: glpi-producao
    timeout-minutes: 30
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GLPI_CORRECOES_SPREADSHEET_ID: ${{ secrets.GLPI_CORRECOES_SPREADSHEET_ID }}
      GLPI_BASE_URL: ${{ secrets.GLPI_BASE_URL }}
      GLPI_APP_TOKEN: ${{ secrets.GLPI_APP_TOKEN }}
      GLPI_USER_TOKEN: ${{ secrets.GLPI_USER_TOKEN }}
    steps:
      - name: Validar gates de aplicacao
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
          HABILITAR_ESCRITA_GLPI: ${{ secrets.HABILITAR_ESCRITA_GLPI }}
        run: |
          test "$CONFIRMACAO" = "APLICAR_GLPI" || { echo "Confirmacao invalida." >&2; exit 1; }
          test "$HABILITAR_ESCRITA_GLPI" = "SIM" || { echo "Escrita GLPI desabilitada por secret." >&2; exit 1; }
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-leves.txt
      - name: Instalar dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Aplicar correcoes aprovadas
        env:
          INPUT_CONFIRMACAO: ${{ inputs.confirmacao }}
          INPUT_IDS: ${{ inputs.ids }}
          INPUT_LIMITE: ${{ inputs.limite }}
        run: |
          python src/sincronizar_correcoes_glpi.py \
            --aplicar \
            --confirmacao "$INPUT_CONFIRMACAO" \
            --ids "$INPUT_IDS" \
            --limite "$INPUT_LIMITE" \
            --saida-json outputs/glpi/relatorio.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: relatorio-sincronizacao-glpi-${{ github.run_id }}
          path: outputs/glpi/relatorio.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
