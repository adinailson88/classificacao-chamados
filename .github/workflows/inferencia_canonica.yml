name: Inferencia estatistica canonica (offline)

on:
  workflow_dispatch:
    inputs:
      repeticoes:
        description: "Repeticoes do bootstrap por grupo"
        required: false
        default: "1000"

permissions:
  contents: read

jobs:
  inferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-estatistica.txt
      - name: Dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements-estatistica.txt
      - name: Testes da inferencia
        run: python -m unittest discover -s tests -p "test_inferencia_canonica.py" -t tests
      - name: Inferir sobre os artefatos da rodada canonica
        id: inferencia
        continue-on-error: true
        run: python src/inferencia_canonica.py --repeticoes "${{ inputs.repeticoes }}"
      - name: Publicar relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inferencia-canonica
          path: |
            docs/dados/inferencia_canonica.json
            docs/INFERENCIA_CANONICA.md
          if-no-files-found: error
          retention-days: 30
      - name: Aplicar criterio de aceite
        if: steps.inferencia.outcome == 'failure'
        run: |
          echo "Inferencia concluiu com bloqueios; consulte o artefato." >&2
          exit 1
