name: Restaurar coluna O do RECLASS_HISTORICO

# Reconstroi a coluna O (Classificacao IA - 2) da aba principal a partir da
# trilha append-only RECLASS_HISTORICO, tomando a ultima entrada por linha
# ANTERIOR ao corte.
#
# Motivo (incidente de 2026-08-01): a coluna O foi apagada manualmente para
# permitir reprocessar o BERTimbau -- src/reclassificar_validados.py so atua em
# linhas com O VAZIA. O efeito colateral: a coluna P (CONFERENCIA IA - 2) guarda
# o veredito humano SOBRE O VALOR DE O; ao repreencher O, os vereditos passaram
# a se referir a predicoes que o avaliador nunca revisou. Os decididos cairam de
# 8.895 para 1.927 e os conflitos subiram de 201 para 7.469.
#
# So escreve na coluna O. NUNCA em CATEGORIA COMPLETA (C, IMPORTRANGE) -- ha
# guarda explicita no script, alem da recusa de escrever em coluna com formula.
# Sem aplicar=true = dry-run.

on:
  workflow_dispatch:
    inputs:
      corte:
        description: "So usa entradas do historico ANTERIORES a esta data/hora (dd/mm/aaaa hh:mm)"
        default: "01/08/2026 00:00"
      run_id_arquivo:
        description: >-
          Opcional (Fase 4, 09/2026): ID de um run do exportar_reclass_historico.yml ou
          truncar_reclass_historico.yml cujo artifact tem o CSV arquivado do
          RECLASS_HISTORICO anterior ao truncamento. So necessario se --corte for
          anterior ao truncamento (a aba viva sozinha nao tem mais esse historico).
        default: ""
      aplicar:
        description: "Gravar na coluna O (sem isso, so relata em dry-run)"
        type: boolean
        default: false

concurrency:
  # Grupo proprio, NAO 'escrita-planilha': aquela fila e saturada pelos crons de
  # 15 min e o GitHub so mantem 1 run pendente por grupo, entao a restauracao era
  # expulsa da fila antes de rodar (run 30708443410, cancelled). Nao ha corrida
  # real: nenhum cron de 15 min escreve na coluna O -- etapa1_turnos escreve G e o
  # snapshot, multimodelo escreve as abas CLASSIF__, dashboard so le. O unico
  # escritor de O e src/reclassificar_validados.py (workflow transformer_ft), que
  # nao roda a cada 15 min.
  group: restaurar-coluna-o
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restaurar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt
      - name: Dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Teste offline da logica de reconstrucao
        # unittest, nao pytest: pytest nao esta em requirements-leves.txt
        # (run 30708698503 falhou com "No module named pytest").
        run: python -m unittest discover -s tests -p "test_restaurar_coluna_o.py" -t tests
      - name: Baixar CSV arquivado (Fase 4 -- so se run_id_arquivo foi informado)
        if: ${{ github.event.inputs.run_id_arquivo != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.inputs.run_id_arquivo }}
          path: dados/arquivo_reclass_historico_baixado
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Restaurar coluna O
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.aplicar }}" = "true" ]; then FLAGS="--aplicar"; fi
          ARQUIVO=""
          if [ "${{ github.event.inputs.run_id_arquivo }}" != "" ]; then
            CSV="$(find dados/arquivo_reclass_historico_baixado -name '*.csv' -print -quit)"
            if [ -z "$CSV" ]; then
              echo "run_id_arquivo informado, mas nenhum CSV encontrado no artifact." >&2
              exit 1
            fi
            echo "usando arquivo arquivado: $CSV"
            ARQUIVO="--arquivo-historico $CSV"
          fi
          python scripts/migracoes/restaurar_coluna_o.py \
            --corte "${{ github.event.inputs.corte }}" $ARQUIVO $FLAGS
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
