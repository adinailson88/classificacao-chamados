name: Sincronizar chamados novos da origem para a aba principal

# O acionador do Apps Script que copiava A:F da origem do GLPI para a aba principal deixou de inserir
# chamados novos (ultima insercao em 22/10/2026, vide LOG_COPIA_A_F). Este workflow faz a mesma copia,
# apenas de linhas novas em A:F, sem tocar em G:Q nem em linhas existentes (ver src/sincronizar_novos_chamados.py).
#
# Agendado roda com --aplicar. Disparo manual (workflow_dispatch) fica em dry-run por padrao.
# A origem so recebe chamados novos nos dias do export do GLPI (segunda, quarta e sexta, com a VPN),
# entao uma execucao diaria cobre o intervalo e e idempotente.

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:
    inputs:
      aplicar:
        description: "true para gravar de verdade; false (padrao) so relata"
        type: boolean
        default: false

concurrency:
  group: escrita-planilha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      ORIGEM_GLPI_SPREADSHEET_ID: ${{ secrets.ORIGEM_GLPI_SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt
      - name: Instalar dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Sincronizar chamados novos
        env:
          APLICAR: ${{ github.event_name == 'schedule' || github.event.inputs.aplicar == 'true' }}
        run: |
          if [ "$APLICAR" = "true" ]; then
            python src/sincronizar_novos_chamados.py --aplicar
          else
            python src/sincronizar_novos_chamados.py
          fi
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
