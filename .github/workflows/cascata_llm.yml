name: Cascata LLM - teste de viabilidade (Trilha B)

on:
  # Push desativado: o GitHub Models nao respondeu a partir do runner (ver PLANO). Disparo manual apenas.
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  cascata:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-leves.txt
      - name: Dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Testes
        run: python -m unittest discover -s tests -p "test_cascata_llm.py" -t tests
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Rodar o LLM na amostra (textos mascarados, nada versionado alem de agregados)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/cascata_llm.py --config config_experimento.json
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Publicar resultado como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascata-llm
          path: docs/dados/trilha_b/cascata_llm.json
          if-no-files-found: ignore
          retention-days: 30
