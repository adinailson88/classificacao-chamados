name: Comparar modelos (lote)

# Roda 1 modelo (ou 'todos' os leves) sobre o MESMO lote [inicio, inicio+limite),
# na mesma ordem, e produz metricas comparaveis (COMPARACAO_MODELOS / _CATEGORIA /
# _PREVISOES). Nao altera o fluxo de classificacao (etapa1/etapa2).
# Manual: dry-run por padrao. Gravacao exige aplicar=true apos revisao do diagnostico.

on:
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      modelo:
        description: "Modelo (ou 'todos' = leves)"
        type: choice
        default: todos
        options:
          - todos
          - naive_bayes
          - regressao_logistica
          - linear_svc
          - linear_svc_glossario
          - sgd
          - extra_trees
          - random_forest
          - lstm
      inicio:
        description: "Indice inicial do lote"
        default: "0"
      limite:
        description: "Tamanho do lote (0 = todos)"
        default: "200"
      passo:
        description: "Se >0, ladrilha TODA a base nesse passo e substitui a tabela"
        default: "0"
      aplicar:
        description: "Gravar somente nas abas privadas COMPARACAO_*"
        type: boolean
        default: false

# Grupo proprio: comparacoes escrevem apenas nas abas COMPARACAO_* e nao devem
# bloquear classificacao principal ou dashboard.
concurrency:
  group: comparacao-modelos
  cancel-in-progress: false

# Menor escopo: so o job "comparar" persiste o marcador de automacao (via
# helper). "guard" so le docs/dados/resumo.json e herda o contents:read padrao.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      executar: ${{ steps.g.outputs.executar }}
      valor_atual: ${{ steps.g.outputs.valor_atual }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Avaliar avanco da base
        id: g
        run: python src/guard_automacao.py --chave comparar_modelos --metrica registros --limiar 1000 --forcar-se-aba-zero comparacao_modelos

  comparar:
    needs: guard
    if: ${{ github.event_name == 'workflow_dispatch' || needs.guard.outputs.executar == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-leves.txt
            requirements.txt
      - name: Dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: TensorFlow apenas para LSTM
        if: ${{ github.event.inputs.modelo == 'lstm' }}
        run: python -m pip install --retries 5 --timeout 120 tensorflow==2.17.0
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Comparar no lote comum
        run: |
          PASSO="${{ github.event.inputs.passo || '0' }}"
          APLICAR=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PASSO="1000"
            APLICAR="--aplicar"
          elif [ "${{ github.event.inputs.aplicar }}" = "true" ]; then
            APLICAR="--aplicar"
          fi
          python src/comparar_modelos_lote.py \
            --modelo "${{ github.event.inputs.modelo || 'todos' }}" \
            --inicio "${{ github.event.inputs.inicio || '0' }}" \
            --limite "${{ github.event.inputs.limite || '200' }}" \
            --passo "$PASSO" \
            $APLICAR
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Persistir marcador de automacao
        if: ${{ github.event_name == 'schedule' || github.event.inputs.aplicar == 'true' }}
        run: |
          python src/persistir_estado_automacao.py \
            --chave comparar_modelos \
            --valor '${{ needs.guard.outputs.valor_atual || '0' }}' \
            --aplicar
