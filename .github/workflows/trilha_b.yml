name: Trilha B - particoes, retreino e avaliacao temporal

# Le o snapshot imutavel CORTE_B_<data> (somente leitura na planilha), confere as
# impressoes digitais do manifesto e gera artefatos em docs/dados/trilha_b/.
# Nao escreve na planilha nem toca nos artefatos do ARTIGO_CONGELADO.
# O push so existe para permitir a execucao enquanto o arquivo nao esta na branch
# padrao: a mensagem do commit precisa conter [trilha-b:particoes],
# [trilha-b:retreino] ou [trilha-b:temporal].

on:
  push:
    branches: [claude/xenodochial-nightingale-81823d]
    paths:
      - ".github/workflows/trilha_b.yml"
      - "src/trilha_b.py"
  workflow_dispatch:  # disparo manual quando o arquivo estiver na main
    inputs:
      etapa:
        description: "Etapa"
        type: choice
        default: particoes
        options: [particoes, retreino, temporal]
      modelos:
        description: "Modelos separados por virgula"
        default: "naive_bayes,regressao_logistica,linear_svc,sgd,extra_trees,random_forest,lstm"

concurrency:
  group: trilha-b
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  executar:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[trilha-b:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      PYTHONHASHSEED: "0"
      TF_DETERMINISTIC_OPS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements.txt
      - name: Testes da Trilha B
        run: python -m unittest discover -s tests -p "test_trilha_b.py" -t tests
      - name: Definir etapa e modelos
        id: cfg
        env:
          MENSAGEM: ${{ github.event.head_commit.message }}
          ETAPA_INPUT: ${{ inputs.etapa }}
          MODELOS_INPUT: ${{ inputs.modelos }}
        run: |
          ETAPA="$ETAPA_INPUT"
          if [ -z "$ETAPA" ]; then
            ETAPA="$(printf '%s' "$MENSAGEM" | grep -o '\[trilha-b:[a-z]*\]' | head -1 | sed -E 's/\[trilha-b:([a-z]*)\]/\1/')"
          fi
          case "$ETAPA" in particoes|retreino|temporal) ;; *) echo "Etapa invalida: '$ETAPA'" >&2; exit 1;; esac
          MODELOS="${MODELOS_INPUT:-naive_bayes,regressao_logistica,linear_svc,sgd,extra_trees,random_forest,lstm}"
          echo "etapa=$ETAPA" >> "$GITHUB_OUTPUT"
          echo "modelos=$MODELOS" >> "$GITHUB_OUTPUT"
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Executar a etapa
        id: etapa
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: python src/trilha_b.py "${{ steps.cfg.outputs.etapa }}" --modelos "${{ steps.cfg.outputs.modelos }}"
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trilha-b-${{ steps.cfg.outputs.etapa }}
          path: docs/dados/trilha_b/
          if-no-files-found: ignore
          retention-days: 30
      - name: Aplicar criterio de aceite
        if: steps.etapa.outcome == 'failure'
        run: |
          echo "A etapa falhou; consulte o log do passo anterior." >&2
          exit 1
