name: Atualizar dashboard

# Exporta os agregados (sem texto de chamado) para docs/dados/*.json e commita,
# alimentando o site estatico (GitHub Pages, pasta /docs). So LE a planilha.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      atualizar_modelos:
        description: "Reler CLASSIF__* e renovar os artefatos"
        type: boolean
        default: false
  workflow_run:
    workflows:
      - "Comparar modelos (lote)"
      - "Multimodelo - reclassificacao"
      - "Transformer fine-tuning (BERTimbau)"
    types:
      - completed

concurrency:
  group: escrita-planilha
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dashboard:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements-leves.txt"
      - run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Exportar JSON do dashboard
        run: |
          FONTE="auto"
          if [ "${{ github.event_name }}" = "workflow_run" ] || \
             { [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%H)" = "03" ]; } || \
             [ "${{ github.event.inputs.atualizar_modelos }}" = "true" ]; then
            FONTE="planilha"
          fi
          python src/exportar_dashboard.py --fonte-modelos "$FONTE"
      - name: Gerar analise Shannon
        run: python src/analise_shannon.py
      - name: Empacotar classificacao sanitizada
        run: python src/empacotar_classificacao_dashboard.py
      - name: Publicar pacote de classificacao da execucao
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-classificacao-${{ github.run_id }}
          path: artefatos/dashboard/classificacao
          if-no-files-found: error
          retention-days: 30
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Commit dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Allowlist default-deny: so os arquivos que src/exportar_dashboard.py e
          # src/analise_shannon.py realmente escrevem podem ser commitados. Qualquer
          # outro arquivo alterado em docs/dados (por exemplo um artefato
          # cientifico/canonico) falha o job antes de qualquer git add/commit/push.
          FIXAS=(
            log_turnos_classificacao.json
            metricas_por_categoria.json
            log_turnos_reclassificacao.json
            metricas_experimento.json
            comparacao_modelos.json
            comparacao_categoria.json
            multimodelo_turnos.json
            multimodelo_metricas.json
            multimodelo_reclass_turnos.json
            comparacao_previsoes.json
            reclass_resumo.json
            estabilidade_reclassificacao.json
            calibracao.json
            registros.json
            calibracao_modelos.json
            calibracao_ajustada_modelos.json
            registros_modelos_auditoria.json
            resumo.json
            shannon_resumo.json
            shannon_modelos.json
            jensen_shannon_modelos.json
            shannon_categorias.json
            shannon_votos.json
          )

          # Nomes dinamicos permitidos: docs/dados/registros_<modelo>.json, um por
          # modelo em multimodelo.modelos_leves/modelos_pesados do
          # config_experimento.json (mesma fonte que exportar_dashboard.py usa para
          # decidir quais registros_<modelo>.json gravar). Cada nome e validado
          # contra um padrao estrito antes de virar path esperado.
          MODELOS="$(python3 - <<'PY'
          import json, re, sys
          c = json.load(open('config_experimento.json', encoding='utf-8'))
          mm = c.get('multimodelo', {}) or {}
          nomes = list(mm.get('modelos_leves', [])) + list(mm.get('modelos_pesados', []))
          for n in nomes:
              if not re.fullmatch(r'[a-z0-9_]+', str(n)):
                  print(f'modelo invalido em config_experimento.json: {n!r}', file=sys.stderr)
                  sys.exit(1)
              print(n)
          PY
          )"

          ALLOWLIST="$(mktemp)"
          printf '%s\n' "${FIXAS[@]}" > "$ALLOWLIST"
          while IFS= read -r modelo; do
            [ -n "$modelo" ] && echo "registros_${modelo}.json" >> "$ALLOWLIST"
          done <<< "$MODELOS"

          # Valida a lista de paths alterados (um por linha, via stdin) contra a
          # allowlist acima e preenche o array global STAGE_LIST com os aprovados.
          # Chamada diretamente (nunca via "$(...)"), para que o "exit 1" em caso
          # de path inesperado aborte o job inteiro, e nao so uma subshell.
          validar_e_montar_stage() {
            STAGE_LIST=()
            local inesperados=""
            local path dir base
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              dir="$(dirname "$path")"
              base="$(basename "$path")"
              if [ "$dir" != "docs/dados" ] || ! grep -qxF "$base" "$ALLOWLIST"; then
                inesperados="${inesperados}${path}\n"
                continue
              fi
              STAGE_LIST+=("$path")
            done <<< "$1"

            if [ -n "$inesperados" ]; then
              echo "BLOQUEADO: arquivo(s) inesperado(s) alterado(s) em docs/dados (fora da allowlist deste workflow):" >&2
              printf '%b' "$inesperados" >&2
              exit 1
            fi
          }

          # Arquivos tracked modificados + novos nao tracked + removidos, dentro de
          # docs/dados, nesta execucao.
          CHANGED="$(git status --porcelain -- docs/dados | sed -E 's/^...//')"
          validar_e_montar_stage "$CHANGED"

          if [ "${#STAGE_LIST[@]}" -eq 0 ]; then
            echo "sem mudancas nos dados"; exit 0
          fi

          # Antes do git add: restaura para o conteudo de HEAD os JSONs, dentre os
          # ja aprovados pela allowlist acima, cuja unica mudanca substantiva seja
          # o campo "gerado_em" no nivel superior do objeto (ver
          # src/filtrar_noop_dashboard.py). Isso evita commits cujo unico efeito
          # e atualizar um timestamp sem mudanca real nos dados. Falha fechado
          # (aborta o job sem sobrescrever nada) se algum JSON estiver invalido.
          python src/filtrar_noop_dashboard.py -- "${STAGE_LIST[@]}"

          # Releitura apos o filtro: recomputa quais paths continuam realmente
          # modificados e reaplica o mesmo default-deny sobre o resultado.
          CHANGED="$(git status --porcelain -- docs/dados | sed -E 's/^...//')"
          validar_e_montar_stage "$CHANGED"

          if [ "${#STAGE_LIST[@]}" -eq 0 ]; then
            echo "sem mudancas substantivas nos dados"; exit 0
          fi

          git add -- "${STAGE_LIST[@]}"
          git commit -m "dados do dashboard [skip ci]"
          for i in 1 2 3 4 5; do
            # Falha explicita em conflito real: sem -X theirs, um conflito verdadeiro
            # nos arquivos ja validados pela allowlist acima aborta o rebase (linha
            # abaixo) em vez de escolher uma versao silenciosamente.
            git pull --rebase --autostash origin main && git push && exit 0
            # aborta rebase preso para a proxima tentativa nao herdar 'unmerged files'.
            git rebase --abort 2>/dev/null || true
            echo "push rejeitado (tentativa $i/5); novo rebase em 5s"; sleep 5
          done
          echo "push falhou apos 5 tentativas" >&2; exit 1
