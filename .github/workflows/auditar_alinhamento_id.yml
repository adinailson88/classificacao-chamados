name: Auditar alinhamento G x id_chamado (autocorrige)

# Fecha a lacuna do gate de escrita (PR #254, 30/08/2026): aquele gate so
# protege o INSTANTE em que uma linha e (re)gravada. Uma linha ja classificada
# nunca mais passa por ele, entao se o IMPORTRANGE deslocar linhas por causa
# de um chamado novo inserido no MEIO da fonte, a coluna G fica presa com a
# IA de outro chamado em silencio (foi o que aconteceu a partir da linha
# 13304 em 09/2026, sem nenhum erro em nenhum workflow).
#
# Este workflow compara diariamente o id_chamado atual (coluna A) com o
# id_chamado registrado em SNAPSHOT_ETAPA_1 na ultima classificacao de cada
# linha. Divergencia = G orfa: limpa SOMENTE G:K dessa linha (preserva
# M/N/O/P/Q, a conferencia humana), ela volta a pendente e o proximo turno de
# etapa1_turnos.yml (ja protegido pelo gate) reclassifica certo.
#
# Agendado ja roda com --aplicar (mesmo nivel de confianca do etapa1_turnos.yml,
# que ja escreve na planilha sem humano no loop a cada 15 min). Disparo manual
# (workflow_dispatch) fica em dry-run por padrao.

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      aplicar:
        description: "true para limpar de verdade as linhas orfas; false (padrao) so relata"
        type: boolean
        default: false

concurrency:
  group: escrita-planilha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auditar-alinhamento:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt
      - name: Instalar dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Auditar alinhamento
        env:
          APLICAR: ${{ github.event_name == 'schedule' || github.event.inputs.aplicar == 'true' }}
        run: |
          if [ "$APLICAR" = "true" ]; then
            python src/auditar_alinhamento_id.py --aplicar
          else
            python src/auditar_alinhamento_id.py
          fi
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
