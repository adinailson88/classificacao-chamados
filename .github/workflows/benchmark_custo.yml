name: Benchmark de custo computacional dos modelos

# Mede tempo de treino e de inferencia de cada modelo no MESMO tipo de runner
# (ubuntu-latest, CPU) em que o BERTimbau foi treinado. Sem essa medida, a
# afirmacao de que o transformador nao compensa fica retorica.
#
# READ-ONLY na planilha: le a base para treinar e nao grava celula nenhuma.
# Nenhum texto de chamado entra no JSON publicado -- so tempos e contagens.
#
# Sem cron: custo nao muda a cada conferencia nova. Roda quando o pesquisador
# precisar do numero atualizado para o artigo.

on:
  workflow_dispatch:
    inputs:
      repeticoes:
        description: "Execucoes por modelo (reporta a mediana)"
        default: "3"
      modelos:
        description: "'leves', 'todos' ou lista separada por virgula"
        default: "todos"

concurrency:
  group: benchmark-custo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  medir:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt
      - name: Dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: TensorFlow (necessario para o LSTM)
        if: ${{ github.event.inputs.modelos != 'leves' }}
        run: python -m pip install --retries 5 --timeout 120 tensorflow==2.17.0
      - name: Teste offline do benchmark
        run: python -m unittest discover -s tests -p "test_benchmark_custo_modelos.py" -t tests
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Medir custo
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/benchmark_custo_modelos.py \
            --repeticoes "${{ github.event.inputs.repeticoes || '3' }}" \
            --modelos "${{ github.event.inputs.modelos || 'todos' }}"
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Commitar resultado
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dados/custo_computacional.json
          git diff --cached --quiet && { echo "sem mudanca"; exit 0; }
          git commit -m "custo computacional por modelo [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push rejeitado (tentativa $i/5); novo rebase em 5s"; sleep 5
          done
          echo "push falhou apos 5 tentativas" >&2; exit 1
