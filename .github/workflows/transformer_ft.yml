name: Transformer fine-tuning (BERTimbau)

# BERTimbau (transformer pre-treinado em portugues) com FINE-TUNING — o 8o modelo,
# comparavel aos 7. PESADO: torch + transformers, treina em CPU no runner GitHub-hosted.
#
# LIMITE REAL DO RUNNER: runners GitHub-hosted tem teto RIGIDO de 6 h por job. Por isso
# este workflow NAO confia em timeout-minutes alto (acima de 6 h nao tem efeito) — usa
# timeout-minutes=330 (abaixo do teto) e um ORCAMENTO DE TEMPO interno
# (TRANSFORMER_TIME_BUDGET_S) para o treino encerrar sozinho, salvando o melhor modelo,
# antes de ser morto pelo GitHub. Fine-tuning de base inteira (~13.8k) em CPU NAO cabe
# em 6 h: o modo automatico usa subamostragem estratificada + early stopping; a fidelidade
# total (base inteira) exige modo manual com self-hosted runner ou divisao do treino.
#
# Fluxo OPERACIONAL (unico proposito deste workflow): reclassificar_validados — refaz a
# coluna O dos chamados validados (M e N) com o BERTimbau fine-tuned. Nunca usa selecao
# experimental (TRANSFORMER_SELECT sempre "none"). Experimentos cientificos/manuais
# (diagnostico cluster_coreset, comparacao held-out full ou sobre coreset em
# COMPARACAO_MODELOS) vivem em .github/workflows/transformer_ft_experimentos.yml,
# workflow_dispatch-only, sem escrita em main nem na planilha (Lote 8G-B).
#
# GOVERNANCA DE ESCRITA (Lote 8G-B): permissions e' contents:read no topo do workflow.
# Somente o job persistir_estado tem contents:write, e so roda apos treino operacional
# REAL bem-sucedido (houve_treino=true). Esse job so pode staged/commitar
# docs/dados/bertimbau_training_state.json (allowlist estrita com default-deny
# antes do commit). dados/estado_automacao.json NAO entra mais nesse commit textual
# -- e persistido separadamente por src/persistir_estado_automacao.py, que parte
# sempre do SHA remoto mais recente e altera so a chave 'transformer_ft' (Lote 8H-B2).

on:
  # Noturno: ~02:17 America/Bahia (UTC-3) = 05:17 UTC. Minuto 17 evita o pico do topo
  # da hora no GitHub Actions. Baixa frequencia (1x/dia) e condicionado por guarda.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "smoke | auto | manual | force | full"
        type: choice
        default: manual
        options:
          - smoke
          - auto
          - manual
          - force
          - full
      forcar_treino:
        description: "Treinar mesmo sem 100 novas conferencias (nao ignora validacoes basicas)"
        type: boolean
        default: false
      max_epochs:
        description: "Epocas de fine-tuning (vazio = padrao do modo)"
        default: ""
      amostra_teste:
        description: "Para modo smoke: nº de exemplos sinteticos"
        default: "40"
      publicar_dashboard:
        description: "Apos sucesso, deixar o dashboard.yml republicar (workflow_run)"
        type: boolean
        default: true

# Nao permite dois fine-tunings BERTimbau simultaneos. Grupo PROPRIO (nao 'escrita-planilha')
# para um treino de horas NAO bloquear etapa1/dashboard; a escrita final na coluna O e curta
# e tem retry proprio no script.
concurrency:
  group: bertimbau-finetune
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      modo: ${{ steps.modo.outputs.modo }}
      treinar: ${{ steps.decidir.outputs.treinar }}
      valor_atual: ${{ steps.guard.outputs.valor_atual }}
      motivo: ${{ steps.guard.outputs.motivo }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: modo
        run: |
          MODO="${{ github.event.inputs.modo || 'auto' }}"
          echo "modo=$MODO" >> "$GITHUB_OUTPUT"
          echo "Modo: $MODO (evento: ${{ github.event_name }})"
      - name: Validar secrets (modos reais; smoke dispensa)
        if: ${{ steps.modo.outputs.modo != 'smoke' }}
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          falta=""
          [ -z "$SPREADSHEET_ID" ] && falta="$falta SPREADSHEET_ID"
          [ -z "$GCP_SA_KEY" ] && falta="$falta GCP_SA_KEY"
          if [ -n "$falta" ]; then
            echo "::error::Secrets ausentes:$falta — necessarios para o modo '${{ steps.modo.outputs.modo }}'. Rode com modo=smoke para validar sem secrets."
            exit 1
          fi
          echo "Secrets necessarios presentes (conteudo nao exibido)."
      - id: guard
        name: Guarda de avanco (100 novas conferencias)
        run: |
          MODO="${{ steps.modo.outputs.modo }}"
          FORCAR="${{ github.event.inputs.forcar_treino || 'false' }}"
          # Sempre calcula o valor REAL da metrica (leitura local de docs/dados/resumo.json
          # e dados/estado_automacao.json, sem segredos/rede) e a decisao padrao da guarda.
          # So no modo auto sem forcar essa decisao vale como esta; nos demais casos a
          # execucao e forcada abaixo, mas o marcador persistido continua sendo o valor
          # REAL -- nunca mais volta a 0 so porque a guarda foi ignorada (correcao do
          # Lote 8G-B: valor da metrica e decisao de executar sao coisas separadas).
          python src/guard_automacao.py --chave transformer_ft --metrica validados --limiar 100
          if [ "$MODO" != "auto" ] || [ "$FORCAR" = "true" ]; then
            {
              echo "executar=true"
              echo "motivo=guarda ignorada (modo=$MODO, forcar=$FORCAR); valor_atual real preservado"
            } >> "$GITHUB_OUTPUT"
            echo "Guarda ignorada (modo=$MODO, forcar=$FORCAR); valor_atual real preservado."
          fi
      - id: decidir
        run: echo "treinar=${{ steps.guard.outputs.executar }}" >> "$GITHUB_OUTPUT"

  smoke:
    needs: preparar
    if: ${{ needs.preparar.outputs.modo == 'smoke' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-leves.txt
            requirements-transformer.txt
      - name: Cache do Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bertimbau
      - name: Dependencias
        run: |
          python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
          python -m pip install --retries 5 --timeout 600 -r requirements-transformer.txt
      - name: Smoke test (sintetico, sem planilha)
        run: python src/smoke_transformer.py --n "${{ github.event.inputs.amostra_teste || '40' }}"

  treinar:
    needs: preparar
    if: ${{ needs.preparar.outputs.treinar == 'true' && needs.preparar.outputs.modo != 'smoke' }}
    runs-on: ubuntu-latest
    # Abaixo do teto rigido de 6 h do runner GitHub-hosted (acima de 360 nao tem efeito).
    timeout-minutes: 330
    outputs:
      houve_treino: ${{ steps.treino.outputs.houve_treino }}
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      # Orcamento de tempo interno: 300 min < 330 do job < 360 do runner. Deixa margem
      # para download do modelo e escrita na coluna O antes do teto.
      TRANSFORMER_TIME_BUDGET_S: "18000"
      TRANSFORMER_EARLY_STOP: "1"
      TRANSFORMER_EPOCHS: ${{ github.event.inputs.max_epochs || '4' }}
      # Modo auto: subamostra estratificada para CABER em CPU/6h. manual/force/full: base inteira.
      TRANSFORMER_MAX_TRAIN: ${{ needs.preparar.outputs.modo == 'auto' && '4000' || '0' }}
      # Fluxo operacional NUNCA usa selecao experimental: sempre base completa/subamostra
      # padrao. cluster_coreset fica exclusivamente no workflow de experimentos.
      TRANSFORMER_SELECT: "none"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-leves.txt
            requirements-transformer.txt
      - name: Cache do Hugging Face (modelo + tokenizer)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bertimbau
      - name: Instalar dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Instalar transformer (torch + transformers)
        run: python -m pip install --retries 5 --timeout 600 -r requirements-transformer.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "::error::Secret GCP_SA_KEY ausente."; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Executar fine-tuning (reclassificar_validados)
        id: treino
        run: |
          echo "Modo=${{ needs.preparar.outputs.modo }} | MAX_TRAIN=$TRANSFORMER_MAX_TRAIN | SELECT=$TRANSFORMER_SELECT | epochs=$TRANSFORMER_EPOCHS"
          # reclassificar_validados so processa linhas com a coluna O VAZIA. Quando nao ha
          # nenhuma, ele encerra com exito sem treinar nada. Detecta o no-op pela linha
          # que o script imprime e propaga a informacao para nao persistir estado
          # operacional sem treino real.
          set -o pipefail
          python src/reclassificar_validados.py --modelo transformer_ft --max-turnos 0 --aplicar \
            | tee saida_reclassificacao.txt
          codigo=${PIPESTATUS[0]}
          if [ "$codigo" -eq 3 ]; then
            # Guarda de qualidade intencional (ganho_vs_g < 0): nao e falha de execucao,
            # a coluna O nao foi tocada de proposito. Nao marca o job como failure.
            echo "houve_treino=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Reclassificacao abortada pela guarda de qualidade (pioraria a IA original) — coluna O nao alterada."
          elif [ "$codigo" -ne 0 ]; then
            exit "$codigo"
          elif grep -q "coluna O pendente" saida_reclassificacao.txt; then
            echo "houve_treino=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nenhum chamado pendente na coluna O — nao houve treino. O estado do BERTimbau NAO sera atualizado."
          else
            echo "houve_treino=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json

  persistir_estado:
    needs: [preparar, treinar]
    if: ${{ always() && needs.treinar.result == 'success' && needs.treinar.outputs.houve_treino == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Registrar estado do treino
        run: |
          python src/escrever_estado_bertimbau.py \
            --status ok \
            --modo "${{ needs.preparar.outputs.modo }}" \
            --acao reclassificar_validados \
            --commit "${{ github.sha }}" \
            --motivo "treino concluido (modo ${{ needs.preparar.outputs.modo }})"
      - name: Commit do estado operacional (allowlist estrita)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dados/bertimbau_training_state.json
          # Default-deny: este job so pode persistir o estado operacional do treino.
          # Se qualquer caminho fora da allowlist ficou staged, falha antes de
          # commitar. dados/estado_automacao.json NAO entra aqui -- e persistido
          # separadamente pelo helper seguro no proximo step.
          INESPERADOS="$(git diff --cached --name-only -- . \
            ':!docs/dados/bertimbau_training_state.json')"
          if [ -n "$INESPERADOS" ]; then
            echo "BLOQUEADO: arquivo(s) fora da allowlist deste job estao staged:" >&2
            echo "$INESPERADOS" >&2
            exit 1
          fi
          git diff --cached --quiet && { echo "sem mudanca no estado"; exit 0; }
          git commit -m "estado BERTimbau: treino ${{ needs.preparar.outputs.modo }} [skip ci]"
          for i in 1 2 3 4 5; do
            # Sem -X theirs: conflito real em docs/dados/bertimbau_training_state.json
            # aborta o rebase (linha abaixo) em vez de escolher uma versao silenciosamente.
            git pull --rebase origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "push rejeitado (tentativa $i/5); novo pull/rebase em 5s"; sleep 5
          done
          echo "push falhou apos 5 tentativas" >&2; exit 1
      - name: Persistir marcador de automacao
        run: |
          python src/persistir_estado_automacao.py \
            --chave transformer_ft \
            --valor "${{ needs.preparar.outputs.valor_atual }}" \
            --aplicar

  registrar_skip:
    needs: preparar
    if: ${{ needs.preparar.outputs.treinar != 'true' && needs.preparar.outputs.modo == 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preservar o ultimo estado valido quando nao ha dados novos
        run: |
          echo "Sem 100 novas conferencias desde o ultimo treino — encerrando com sucesso."
          echo "bertimbau_training_state.json nao sera rebaixado para 'sem_dados'."
          echo "O ultimo status 'ok' continua sendo a referencia ate existir novo treino concluido."
