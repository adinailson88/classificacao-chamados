name: Truncar RECLASS_HISTORICO (Fase 3 - com export fresco antes)

# Fase 3 do plano de reducao de celulas da planilha (2026-09): RECLASS_HISTORICO
# e a maior aba (3.059.112 celulas em 04/09/2026, 33% do limite de 10 milhoes).
# Este workflow SEMPRE faz um export fresco (CSV completo, sobe como artifact)
# antes de considerar qualquer limpeza, e so limpa de verdade com aplicar=true
# E confirmar=TRUNCAR -- dry-run por padrao. A faixa limpa e A2 ate a ultima
# linha/coluna (o cabecalho na linha 1 e sempre preservado), entao os
# escritores (reclassificacao_multimodelo.py, reclassificar_validados.py)
# continuam gravando normalmente depois.
#
# Baixe e arquive o CSV do artifact em algum lugar permanente (Zenodo, Drive)
# -- o artifact do GitHub Actions expira em 90 dias.

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "true para truncar de verdade; false (padrao) so exporta e relata"
        type: boolean
        default: false
      confirmar:
        description: "Digite TRUNCAR para confirmar o truncamento real (ignorado se aplicar=false)"
        default: ""

concurrency:
  group: escrita-planilha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  truncar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt
      - name: Instalar dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Exportar e truncar RECLASS_HISTORICO (dry-run por padrao)
        run: >
          python scripts/migracoes/truncar_reclass_historico.py
          ${{ github.event.inputs.aplicar == 'true' && '--aplicar' || '' }}
          --confirmar "${{ github.event.inputs.confirmar }}"
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Upload do export fresco
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reclass-historico-truncamento
          path: dados/arquivo_reclass_historico/
          retention-days: 90
          if-no-files-found: warn
