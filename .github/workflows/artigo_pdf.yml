name: Gerar PDF do artigo

# Converte 04_artigo/artigo_classificacao_chamados_v3.md em PDF via pandoc/xelatex
# e publica em docs/ (GitHub Pages), ao lado do painel. So LE o .md do repositorio;
# nao le a planilha e nao usa credenciais. Ver 04_artigo/README.md.

on:
  push:
    branches: [main]
    paths:
      - "04_artigo/artigo_classificacao_chamados_v3.md"
      - ".github/workflows/artigo_pdf.yml"
  workflow_dispatch:

concurrency:
  group: gerar-pdf-artigo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gerar-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # placeins.sty nao existe na imagem pandoc/extra e vive versionado em
      # 04_artigo/latex; TEXINPUTS aponta o xelatex para la. Se nao alcancar,
      # o preambulo do .md cai num FloatBarrier proprio em vez de falhar.
      - name: Gerar PDF (pandoc + xelatex)
        uses: docker://pandoc/extra:latest
        env:
          TEXINPUTS: ".:./04_artigo/latex:"
        with:
          args: >-
            04_artigo/artigo_classificacao_chamados_v3.md
            -o docs/artigo_classificacao_chamados.pdf
            --pdf-engine=xelatex
            -V lang=pt-BR
            -V geometry:margin=2.5cm
            --standalone

      - name: Commitar PDF gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/artigo_classificacao_chamados.pdf
          if git diff --cached --quiet; then
            echo "PDF sem mudancas, nada a commitar."
          else
            git commit -m "pdf do artigo gerado automaticamente [skip ci]"
            git push
          fi
