name: Gerar PDF do artigo

# Converte 04_artigo/artigo_classificacao_chamados_v3.md em PDF via pandoc/xelatex
# e publica em docs/ (GitHub Pages), ao lado do painel. So LE o .md do repositorio;
# nao le a planilha e nao usa credenciais. Ver 04_artigo/README.md.

on:
  push:
    branches: [main]
    paths:
      - "04_artigo/artigo_classificacao_chamados_v3.md"
      - ".github/workflows/artigo_pdf.yml"
  workflow_dispatch:

concurrency:
  group: gerar-pdf-artigo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gerar-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # placeins.sty nao existe na imagem pandoc/extra e vive versionado em
      # 04_artigo/latex; TEXINPUTS aponta o xelatex para la. Se nao alcancar,
      # o preambulo do .md cai num FloatBarrier proprio em vez de falhar.
      - name: Gerar PDF (pandoc + xelatex)
        uses: docker://pandoc/extra:latest
        env:
          TEXINPUTS: ".:./04_artigo/latex:"
        with:
          args: >-
            04_artigo/artigo_classificacao_chamados_v3.md
            -o docs/artigo_classificacao_chamados.pdf
            --pdf-engine=xelatex
            -V lang=pt-BR
            -V geometry:margin=2.5cm
            --standalone

      - name: Commitar PDF gerado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/artigo_classificacao_chamados.pdf
          git diff --cached --quiet && { echo "PDF sem mudancas, nada a commitar."; exit 0; }
          git commit -m "pdf do artigo gerado automaticamente [skip ci]"
          for i in 1 2 3 4 5; do
            # Falha explicita em conflito real: sem -X theirs, um conflito verdadeiro
            # em docs/artigo_classificacao_chamados.pdf aborta o rebase (linha abaixo)
            # em vez de escolher uma versao silenciosamente.
            git pull --rebase --autostash origin main && git push && exit 0
            # aborta rebase preso para a proxima tentativa nao herdar 'unmerged files'.
            git rebase --abort 2>/dev/null || true
            echo "push rejeitado (tentativa $i/5); novo rebase em 5s"; sleep 5
          done
          echo "push falhou apos 5 tentativas" >&2; exit 1
