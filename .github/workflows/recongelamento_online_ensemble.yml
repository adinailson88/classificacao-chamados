name: Recongelamento online da base do ensemble (read-only)

on:
  workflow_dispatch:
    inputs:
      base_main_sha:
        description: "SHA de origin/main do qual esta branch partiu"
        required: false
        default: "4cf0d2fa89158c753448ffa0d6f8ec75ef94d51f"

permissions:
  contents: read

jobs:
  recongelar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      # random_state=42 fixa o RNG de alto nivel do LinearSVC, mas BLAS
      # multi-thread (OpenBLAS/MKL) pode somar ponto-flutuante em ordem
      # diferente entre execucoes, mudando margens perto de fronteiras de
      # decisao o suficiente para virar rotulos previstos. Fixar 1 thread
      # remove essa fonte de nao-determinismo sem tocar em nenhum
      # hiperparametro do modelo.
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Dependencias
        run: |
          python -m pip install --retries 5 --timeout 300 -r requirements.txt
          python -m pip install --retries 5 --timeout 120 scipy==1.14.1 statsmodels==0.14.4 matplotlib
      - name: Testes (suite completa)
        run: |
          python -m py_compile src/recongelar_ensemble_online.py src/modelos_zoo.py src/congelar_alvo_ensemble.py
          python -m unittest discover -s tests
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Recongelar sobre o texto online, sem escrever na planilha
        id: recongelamento
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: |
          python src/recongelar_ensemble_online.py \
            --base-main-sha "${{ inputs.base_main_sha }}" \
            --workflow-head-sha "${{ github.sha }}"
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Publicar artefatos sanitizados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recongelamento-online-ensemble
          path: |
            docs/dados/ensemble/recongelamento_online/resumo_recongelamento_online.json
            docs/dados/ensemble/recongelamento_online/alvo_ensemble_online.json
            docs/dados/ensemble/recongelamento_online/particoes_ensemble_online_mapa.csv
            docs/dados/ensemble/recongelamento_online/predicoes_linear_svc_online.csv
            docs/RECONGELAMENTO_ONLINE_ENSEMBLE.md
          if-no-files-found: warn
          retention-days: 30
      - name: Aplicar criterio de aceite
        if: steps.recongelamento.outcome == 'failure'
        run: |
          echo "Recongelamento BLOQUEADO: invariantes de proveniencia nao satisfeitas; consulte o artefato." >&2
          exit 1
