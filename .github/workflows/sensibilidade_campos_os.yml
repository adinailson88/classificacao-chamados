name: Sensibilidade aos campos da OS (temporario, artigo RAP)

# Workflow temporario, so neste branch: compara o classificador e o controle de
# risco com os quatro campos e so com TITULO e DESCRICAO GLPI. Le a planilha
# (read-only) e comita apenas numeros agregados, sem texto nem IDs.

on:
  push:
    branches: [agent/sensibilidade-campos-os]
    paths:
      - src/sensibilidade_campos_os.py
      - .github/workflows/sensibilidade_campos_os.yml
  workflow_dispatch:

concurrency:
  group: sensibilidade-campos-os
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sensibilidade:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt
      - name: Dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt scipy==1.13.1
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Rodar a sensibilidade
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: python src/sensibilidade_campos_os.py
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
      - name: Commitar o JSON
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dados/sensibilidade_campos_os.json
          git diff --cached --quiet && { echo "sem mudanca"; exit 0; }
          git commit -m "sensibilidade aos campos da OS [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
