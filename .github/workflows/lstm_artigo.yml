name: Figuras do artigo (read-only)

# Regenera, somente para inspecao (artifact), as seis figuras oficiais do
# artigo atual. Read-only em relacao ao repositorio: nao acessa Google
# Sheets, nao treina modelo e nunca commita/da push.
#
# Por decisao cientifica do Lote 7G, as demais rotinas historicas que este
# workflow expunha ate o Lote 7F deixaram de ser disparaveis por GitHub
# Actions: os resultados ja versionados sao preservados, mas nao sao mais
# recalculados a partir da planilha viva. Os scripts e os artefatos que
# produziram continuam no repositorio, disponiveis para execucao manual
# fora de Actions se uma decisao futura exigir (ver historico deste
# arquivo antes do Lote 7G).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  figuras-artigo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib

      - name: Validar sintaxe dos geradores
        run: |
          python -m py_compile \
            src/gerar_figura1_pipeline.py \
            src/gerar_figuras_canonicas.py \
            src/gerar_figura5_curva_aprendizado.py \
            src/estilo_figuras.py

      # As seis figuras atuais do artigo usam somente as fontes cientificas
      # oficiais (Lote 7C/7D): Figura 1 e diagrama estatico; Figuras 2-5 vem
      # do gerador canonico, que confere hash_corpus contra a rodada
      # congelada e aborta se divergir; Figura 6 e o unico gerador do LSTM.
      # Os geradores legados (figura2/3/4/6/7 antigos) leem JSON operacional
      # vivo, nao verificam hash_corpus e escrevem por cima dos mesmos nomes
      # de arquivo -- ficam fora deste caminho.
      - name: Regerar as figuras oficiais do artigo (PDF vetorial + PNG 300 dpi)
        run: |
          python src/gerar_figura1_pipeline.py
          python src/gerar_figuras_canonicas.py \
            --apenas custo confiabilidade categorias matriz
          python src/gerar_figura5_curva_aprendizado.py

      # So informativo: SHA-256 e diffstat nao sao usados como criterio de
      # aprovacao (a identidade byte-a-byte depende do ambiente de
      # renderizacao e do metadado de timestamp do backend PDF do
      # Matplotlib). O criterio cientifico e o hash_corpus conferido acima.
      - name: Relatorio de auditoria das figuras regeneradas
        run: |
          sha256sum \
            04_artigo/figuras/fig_pipeline_governanca.pdf \
            04_artigo/figuras/fig_pipeline_governanca.png \
            04_artigo/figuras/fig_tradeoff_custo.pdf \
            04_artigo/figuras/fig_tradeoff_custo.png \
            04_artigo/figuras/fig_confianca_desfecho.pdf \
            04_artigo/figuras/fig_confianca_desfecho.png \
            04_artigo/figuras/fig_calor_categorias.pdf \
            04_artigo/figuras/fig_calor_categorias.png \
            04_artigo/figuras/fig_matriz_confusao.pdf \
            04_artigo/figuras/fig_matriz_confusao.png \
            04_artigo/figuras/fig_curva_aprendizado_lstm.pdf \
            04_artigo/figuras/fig_curva_aprendizado_lstm.png
          git diff --stat -- 04_artigo/figuras

      # Default-deny: a regeneracao das figuras e read-only em relacao ao
      # repositorio. Qualquer arquivo alterado ou nao rastreado fora dos 12
      # caminhos das seis figuras atuais falha o job antes do upload -- nao
      # ha git add/commit/push neste caminho.
      - name: Verificar allowlist das figuras regeneradas
        run: |
          ALLOWLIST="$(mktemp)"
          cat > "$ALLOWLIST" <<'EOF'
          04_artigo/figuras/fig_pipeline_governanca.pdf
          04_artigo/figuras/fig_pipeline_governanca.png
          04_artigo/figuras/fig_tradeoff_custo.pdf
          04_artigo/figuras/fig_tradeoff_custo.png
          04_artigo/figuras/fig_confianca_desfecho.pdf
          04_artigo/figuras/fig_confianca_desfecho.png
          04_artigo/figuras/fig_calor_categorias.pdf
          04_artigo/figuras/fig_calor_categorias.png
          04_artigo/figuras/fig_matriz_confusao.pdf
          04_artigo/figuras/fig_matriz_confusao.png
          04_artigo/figuras/fig_curva_aprendizado_lstm.pdf
          04_artigo/figuras/fig_curva_aprendizado_lstm.png
          EOF

          CHANGED="$(git status --porcelain | sed -E 's/^...//')"
          INESPERADOS=""
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if ! grep -qxF "$path" "$ALLOWLIST"; then
              INESPERADOS="${INESPERADOS}${path}\n"
            fi
          done <<< "$CHANGED"

          if [ -n "$INESPERADOS" ]; then
            echo "ERRO: figuras_artigo alterou arquivo fora da allowlist." >&2
            printf '%b' "$INESPERADOS" >&2
            exit 1
          fi
          echo "Allowlist conferida: somente os 12 caminhos autorizados foram alterados (ou nenhum)."

      - name: Publicar figuras regeneradas como artefato
        uses: actions/upload-artifact@v4
        with:
          name: figuras-artigo-regeneradas
          path: |
            04_artigo/figuras/fig_pipeline_governanca.pdf
            04_artigo/figuras/fig_pipeline_governanca.png
            04_artigo/figuras/fig_tradeoff_custo.pdf
            04_artigo/figuras/fig_tradeoff_custo.png
            04_artigo/figuras/fig_confianca_desfecho.pdf
            04_artigo/figuras/fig_confianca_desfecho.png
            04_artigo/figuras/fig_calor_categorias.pdf
            04_artigo/figuras/fig_calor_categorias.png
            04_artigo/figuras/fig_matriz_confusao.pdf
            04_artigo/figuras/fig_matriz_confusao.png
            04_artigo/figuras/fig_curva_aprendizado_lstm.pdf
            04_artigo/figuras/fig_curva_aprendizado_lstm.png
          if-no-files-found: error
          retention-days: 30
