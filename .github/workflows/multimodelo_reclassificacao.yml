name: Multimodelo - reclassificacao

# Reclassifica os casos de baixa confianca por modelo, preservando a aba
# CLASSIF__<modelo> e gravando em RECLASS__<modelo>.

on:
  schedule:
    # 05:47 America/Bahia = 08:47 UTC. Compartilha o concurrency
    # 'multimodelo-pipeline' com a classificacao multimodelo
    # (multimodelo_classificacao.yml, cron a cada 15 min): esta
    # reclassificacao LE CLASSIF__<modelo>, que a classificacao ESCREVE, e
    # aguarda nesse grupo se a classificacao ainda estiver rodando.
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      modelos:
        description: "leves, pesados, todos ou lista separada por virgula"
        default: "leves"
      max_turnos:
        description: "Turnos de 15 por modelo (0 = todos os candidatos)"
        default: "0"
      aplicar:
        description: "Gravar na planilha"
        type: boolean
        default: false
      usar_calibrado:
        description: "Selecionar candidatos pela confianca CALIBRADA (em vez da bruta)"
        type: boolean
        default: false
      so_validados:
        description: "Reclassificar APENAS chamados com conferencia humana (M/N/P)"
        type: boolean
        default: false
      gravar_coluna_2:
        description: "Gravar a reclassificacao na coluna O (Classificacao IA - 2) da aba principal (1 modelo)"
        type: boolean
        default: false
      lstm_perfil:
        description: "Perfil LSTM"
        type: choice
        default: padrao
        options:
          - padrao
          - robusto

concurrency:
  group: multimodelo-pipeline
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  reclassificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      LSTM_PERFIL: ${{ github.event.inputs.lstm_perfil || 'padrao' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements-leves.txt
            requirements.txt
      - name: Dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: TensorFlow se LSTM estiver no escopo
        if: ${{ contains(github.event.inputs.modelos || 'lstm', 'lstm') || (github.event.inputs.modelos || 'lstm') == 'pesados' || (github.event.inputs.modelos || 'lstm') == 'todos' }}
        run: python -m pip install --retries 5 --timeout 120 tensorflow==2.17.0
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Reclassificar por modelo
        run: |
          MODELOS_AGENDADOS="naive_bayes,regressao_logistica,linear_svc,sgd,extra_trees,random_forest,lstm"
          MODELOS="${{ github.event.inputs.modelos || 'naive_bayes,regressao_logistica,linear_svc,sgd,extra_trees,random_forest,lstm' }}"
          # Validados (poucos, ~conferencias humanas): TODOS os turnos (0).
          MAX_VALIDADOS="${{ github.event.inputs.max_turnos || '0' }}"
          # Baixa confianca (base inteira): limitado por execucao p/ nao estourar o tempo;
          # e incremental, entao avanca a cada rodada diaria.
          MAX_BAIXA="${{ github.event.inputs.max_turnos || '40' }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "rodada automatica 1/2: validados (todos os turnos)"
            python src/reclassificacao_multimodelo.py \
              --modelos "$MODELOS_AGENDADOS" \
              --max-turnos "$MAX_VALIDADOS" \
              --aplicar \
              --so-validados \
              --contexto-rodada validados

            echo "rodada automatica 2/2: baixa confianca geral (lote por dia)"
            python src/reclassificacao_multimodelo.py \
              --modelos "$MODELOS_AGENDADOS" \
              --max-turnos "$MAX_BAIXA" \
              --aplicar \
              --contexto-rodada baixa_confianca
          else
            MAX_TURNOS="${{ github.event.inputs.max_turnos || '0' }}"
            FLAGS="--modelos $MODELOS --max-turnos $MAX_TURNOS --contexto-rodada manual"
            if [ "${{ github.event.inputs.aplicar }}" = "true" ]; then FLAGS="$FLAGS --aplicar"; fi
            if [ "${{ github.event.inputs.usar_calibrado }}" = "true" ]; then FLAGS="$FLAGS --usar-calibrado"; fi
            if [ "${{ github.event.inputs.so_validados }}" = "true" ]; then FLAGS="$FLAGS --so-validados"; fi
            if [ "${{ github.event.inputs.gravar_coluna_2 }}" = "true" ]; then FLAGS="$FLAGS --gravar-coluna-2"; fi
            echo "flags: $FLAGS"
            python src/reclassificacao_multimodelo.py $FLAGS
          fi
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
