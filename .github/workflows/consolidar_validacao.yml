name: Consolidar validacao humana

on:
  # O cron executa somente o diagnostico read-only. Gravacao exige disparo manual
  # explicito com aplicar=true, apos revisao de um dry-run recente.
  schedule:
    - cron: "50 3 * * *"
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Gravar abas privadas apos revisar o dry-run"
        type: boolean
        default: false

concurrency:
  group: consolidar-validacao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  consolidar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt
      - name: Instalar dependencias leves
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Consolidar validacao M N P Q
        run: |
          CMD="python src/consolidar_validacao.py"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.aplicar }}" = "true" ]; then
            CMD="$CMD --aplicar"
          fi
          eval "$CMD"
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
