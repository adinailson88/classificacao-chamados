name: Auditar abas da planilha (read-only)

# Levanta, sem apagar nada, o custo em celulas de cada aba e quais nao sao mais
# referenciadas pelo pipeline nem pelo painel.
#
# Motivo: a planilha bateu no teto de 10.000.000 de celulas do Google Sheets e
# nao aceita mais criar aba nenhuma.

on:
  workflow_dispatch:

concurrency:
  group: auditar-abas-planilha
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-leves.txt
      - name: Dependencias
        run: python -m pip install --retries 5 --timeout 120 -r requirements-leves.txt
      - name: Recriar chave da conta de servico
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "Secret GCP_SA_KEY ausente." >&2; exit 1; fi
          printf '%s' "$GCP_SA_KEY" > credenciais_sa.json
      - name: Auditar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credenciais_sa.json
        run: python scripts/migracoes/auditar_abas_planilha.py
      - name: Remover credenciais
        if: always()
        run: rm -f credenciais_sa.json
