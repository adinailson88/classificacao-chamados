name: Matriz de proveniencia (offline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proveniencia:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Testes da matriz
        run: python -m unittest discover -s tests -p "test_matriz_proveniencia.py" -t tests
      - name: Montar a matriz
        id: matriz
        continue-on-error: true
        run: python src/matriz_proveniencia.py
      - name: Publicar relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matriz-proveniencia
          path: |
            docs/dados/matriz_proveniencia.json
            docs/MATRIZ_PROVENIENCIA.md
          if-no-files-found: error
          retention-days: 30
      - name: Aplicar criterio de aceite
        if: steps.matriz.outcome == 'failure'
        run: |
          echo "Ha artefato com hash divergente; consulte o relatorio." >&2
          exit 1
